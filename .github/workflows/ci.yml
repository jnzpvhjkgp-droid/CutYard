name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enhetstester
        run: npm test
      - name: Kontrollera att byggda filer är incheckade
        run: |
          npm run build
          git diff --exit-code -- assets/app.css vendor/ assets/fonts/ || (echo "Kör 'npm run build' och checka in resultatet." && exit 1)
